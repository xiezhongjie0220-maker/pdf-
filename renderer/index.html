<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>PDF 压缩助手</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 自定义标题栏 -->
  <header id="titlebar">
    <div class="traffic-lights">
      <button class="tl close" id="tlClose" title="关闭"></button>
      <button class="tl min" id="tlMin" title="最小化"></button>
      <button class="tl max" id="tlMax" title="最大化"></button>
    </div>
    <div class="app-title">PDF 压缩助手</div>
    <div class="titlebar-spacer"></div>
  </header>

  <main>
    <!-- 拖拽区域 -->
    <section id="dropZone" class="drop-zone">
      <div class="drop-icon">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none">
          <path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5" stroke="url(#grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="url(#grad)" stroke-width="1.8" stroke-linecap="round"/>
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="24" y2="24">
              <stop stop-color="#0a84ff"/>
              <stop offset="1" stop-color="#5e5ce6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>拖拽 PDF 文件到这里</h1>
      <p>或者 <button id="browseBtn" class="inline-btn">点击选择文件</button>，支持批量处理</p>
      <p class="drop-tip" id="dropTip">压缩完成后，同名文件将输出到原文件所在目录的「压缩后」文件夹</p>
    </section>

    <!-- 输出位置 -->
    <section id="outputPanel" class="output-panel hidden">
      <div class="panel-title">输出位置</div>
      <div class="output-options">
        <button id="outDefault" class="out-opt active" data-mode="default">
          <span class="out-radio"></span>
          <span class="out-text">
            <span class="out-name">原文件旁「压缩后」文件夹</span>
            <span class="out-desc">每个文件旁边自动新建</span>
          </span>
        </button>
        <button id="outCustom" class="out-opt" data-mode="custom">
          <span class="out-radio"></span>
          <span class="out-text">
            <span class="out-name">自定义文件夹</span>
            <span class="out-desc">全部压缩结果输出到同一位置</span>
          </span>
        </button>
      </div>
      <div id="customRow" class="custom-row hidden">
        <span id="customPath" class="custom-path">尚未选择文件夹</span>
        <button id="chooseFolderBtn" class="folder-btn">选择文件夹…</button>
      </div>
    </section>

    <!-- 压缩级别 -->
    <section id="levelPanel" class="level-panel hidden">
      <div class="panel-title">压缩品质</div>
      <div class="segmented" id="segmented">
        <button class="seg" data-level="q_high">
          <span class="seg-name">高品质</span>
          <span class="seg-desc">约 −55% · 打印/存档</span>
        </button>
        <button class="seg active" data-level="q_mid">
          <span class="seg-name">中品质</span>
          <span class="seg-desc">约 −85% · 屏幕清晰</span>
        </button>
        <button class="seg" data-level="q_low">
          <span class="seg-name">低品质</span>
          <span class="seg-desc">约 −93% · 体积最小</span>
        </button>
      </div>
      <div class="panel-note">按品质压缩：中品质与 WPS 推荐档同水平，屏幕阅读文字清晰；黑白文字始终按 400dpi 保留，不会压糊</div>
    </section>

    <!-- 文件列表 -->
    <section id="fileList" class="file-list"></section>

    <!-- 汇总栏 -->
    <section id="summaryBar" class="summary-bar hidden">
      <div class="summary-stats">
        <div class="stat">
          <span class="stat-label">原始体积</span>
          <span class="stat-value" id="statBefore">—</span>
        </div>
        <div class="stat-arrow">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12h14m0 0l-6-6m6 6l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </div>
        <div class="stat">
          <span class="stat-label">压缩后体积</span>
          <span class="stat-value highlight" id="statAfter">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">共节省</span>
          <span class="stat-value saved" id="statSaved">—</span>
        </div>
      </div>
      <button id="startBtn" class="cta">开始压缩</button>
      <button id="clearBtn" class="ghost">清空列表</button>
    </section>
  </main>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
